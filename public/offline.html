<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a8049">
    <title>Hors ligne — AfriBoost</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
               background: linear-gradient(180deg, #c9ecdf 0%, #eef0cf 55%, #f5ecc4 100%); color: #0f172a; }
        .card { margin: 16px; max-width: 360px; padding: 32px 24px; background: #fff; border-radius: 24px; text-align: center;
                box-shadow: 0 4px 16px -4px rgb(15 23 42 / .12); }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { color: #475569; font-size: 14px; line-height: 1.5; margin: 0; }
        button { margin-top: 20px; border: 0; border-radius: 16px; padding: 14px 20px; width: 100%; font-weight: 700; font-size: 15px;
                 color: #fff; background: #dc2318; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/favicon.svg" width="56" height="56" alt="AfriBoost">
        <h1>Pas de connexion</h1>
        <p>Vérifie ta connexion Internet puis réessaie. Tes missions et ton wallet t'attendent.</p>
        <button onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
